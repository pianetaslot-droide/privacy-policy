<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品详情 - 乐居生活</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <div class="logo"><a href="store.html">乐居<span>生活</span></a></div>
    <div class="header-search">
      <input type="text" id="searchInput">
      <button onclick="handleSearch()" id="searchBtn"></button>
    </div>
    <div class="header-actions">
      <div id="langSwitcher"></div>
      <a href="login.html" id="userLink">&#x1F464;</a>
      <a href="cart.html">&#x1F6D2; <span id="cartLabel"></span> <span class="cart-count" id="cartCount">0</span></a>
    </div>
  </div>
</header>

<div class="container">
  <div class="product-detail" id="productDetail"></div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" id="footerCopyright"></div>
  </div>
</footer>

<div class="toast" id="toast"></div>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  applyPageI18n();

  const params = new URLSearchParams(location.search);
  const productId = parseInt(params.get('id'));
  const product = products.find(p => p.id === productId);

  if (!product) {
    document.getElementById('productDetail').innerHTML = `<div style="text-align:center;padding:80px 20px"><h2>${t('product_not_found')}</h2><p style="margin-top:12px"><a href="products.html" style="color:var(--primary)">${t('back_to_list')}</a></p></div>`;
  } else {
    const name = getProductName(product);
    const desc = getProductDesc(product);
    const detail = getProductDetail(product);
    document.title = name + ' - LeJu Living';

    document.getElementById('productDetail').innerHTML = `
      <div class="detail-gallery">${product.icon}</div>
      <div class="detail-info">
        <h1>${name}</h1>
        <div class="price">${formatPrice(product.price)}
          ${product.originalPrice ? `<span style="font-size:1rem;color:#999;text-decoration:line-through;margin-left:12px">${formatPrice(product.originalPrice)}</span>` : ''}
        </div>
        <div class="meta">
          <div>${t('category_label')}：${getCategoryName(product.category)}</div>
          <div>${t('stock_label')}：${product.stock > 0 ? t('in_stock') : t('out_of_stock')}</div>
          <div>${t('shipping_label')}：${t('free_shipping_note')}</div>
        </div>
        <p style="margin-bottom:24px;line-height:1.8;color:var(--text-light)">${desc}</p>
        <div class="quantity-selector">
          <button onclick="changeQty(-1)">-</button>
          <input type="number" id="qtyInput" value="1" min="1" max="${product.stock}" onchange="validateQty()">
          <button onclick="changeQty(1)">+</button>
        </div>
        <div class="detail-actions">
          <button class="btn btn-primary" onclick="addToCart(${product.id}, getQty())">${t('add_to_cart')}</button>
          <button class="btn btn-outline" style="border-color:var(--primary);color:var(--primary)" onclick="addToCart(${product.id}, getQty()); location.href='cart.html'">${t('buy_now')}</button>
        </div>
        <div class="detail-tabs">
          <div class="tab-headers">
            <button class="active" onclick="switchTab(this, 'tab-desc')">${t('tab_detail')}</button>
            <button onclick="switchTab(this, 'tab-spec')">${t('tab_spec')}</button>
            <button onclick="switchTab(this, 'tab-review')">${t('tab_review')}</button>
          </div>
          <div class="tab-content" id="tab-desc"><p>${detail || t('no_detail')}</p></div>
          <div class="tab-content" id="tab-spec" style="display:none"><p>${t('spec_default').replace(/\n/g, '<br>')}</p></div>
          <div class="tab-content" id="tab-review" style="display:none"><p>${t('no_review')}</p></div>
        </div>
      </div>`;
  }

  function getQty() { return parseInt(document.getElementById('qtyInput').value) || 1; }
  function changeQty(d) {
    const input = document.getElementById('qtyInput');
    let v = parseInt(input.value) + d;
    if (v < 1) v = 1;
    if (v > product.stock) v = product.stock;
    input.value = v;
  }
  function validateQty() {
    const input = document.getElementById('qtyInput');
    let v = parseInt(input.value);
    if (isNaN(v) || v < 1) input.value = 1;
    if (v > product.stock) input.value = product.stock;
  }
  function switchTab(btn, tabId) {
    document.querySelectorAll('.tab-headers button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
    btn.classList.add('active');
    document.getElementById(tabId).style.display = 'block';
  }

  updateCartCount();
  updateUserLink();
</script>
</body>
</html>
