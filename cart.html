<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购物车 - 乐居生活</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <div class="logo"><a href="store.html">乐居<span>生活</span></a></div>
    <div class="header-search">
      <input type="text" id="searchInput">
      <button onclick="handleSearch()" id="searchBtn"></button>
    </div>
    <div class="header-actions">
      <div id="langSwitcher"></div>
      <a href="login.html" id="userLink">&#x1F464;</a>
      <a href="cart.html">&#x1F6D2; <span id="cartLabel"></span> <span class="cart-count" id="cartCount">0</span></a>
    </div>
  </div>
</header>

<div class="container">
  <h2 class="section-title" style="padding-top:32px" id="cartTitle"></h2>
  <div class="cart-page" id="cartPage"></div>
</div>

<footer class="site-footer" style="margin-top:60px">
  <div class="container">
    <div class="footer-bottom" id="footerCopyright"></div>
  </div>
</footer>

<div class="toast" id="toast"></div>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  applyPageI18n();
  setText('cartTitle', t('cart_title'));

  const FREE_SHIPPING_THRESHOLD = 99;

  function renderCart() {
    const cart = getCart();
    const page = document.getElementById('cartPage');

    if (cart.length === 0) {
      page.innerHTML = `
        <div class="cart-empty" style="grid-column:1/-1">
          <div class="icon">&#x1F6D2;</div>
          <h3>${t('cart_empty_title')}</h3>
          <p style="margin:12px 0 24px">${t('cart_empty_subtitle')}</p>
          <a href="products.html" class="btn btn-primary">${t('cart_go_shopping')}</a>
        </div>`;
      return;
    }

    let subtotal = 0;
    let itemsHtml = '';
    cart.forEach(item => {
      const p = products.find(pr => pr.id === item.id);
      if (!p) return;
      const lineTotal = p.price * item.qty;
      subtotal += lineTotal;
      itemsHtml += `
        <div class="cart-item">
          <div class="cart-item-image">${renderProductImage(p, 'card')}</div>
          <div class="cart-item-info">
            <h3><a href="product-detail.html?id=${p.id}">${getProductName(p)}</a></h3>
            <p class="spec">${getCategoryName(p.category)}</p>
            <div class="quantity-selector" style="margin:0">
              <button onclick="updateQty(${p.id}, -1)">-</button>
              <input type="number" value="${item.qty}" min="1" max="${p.stock}" onchange="setQty(${p.id}, this.value)" style="width:48px">
              <button onclick="updateQty(${p.id}, 1)">+</button>
            </div>
          </div>
          <div style="text-align:right">
            <div class="cart-item-price">${formatPrice(lineTotal)}</div>
            <button class="cart-item-remove" onclick="removeFromCart(${p.id})">${t('cart_remove')}</button>
          </div>
        </div>`;
    });

    const shipping = subtotal >= FREE_SHIPPING_THRESHOLD ? 0 : 10;
    const total = subtotal + shipping;
    const gap = FREE_SHIPPING_THRESHOLD - subtotal;

    page.innerHTML = `
      <div class="cart-items">${itemsHtml}</div>
      <div class="cart-summary">
        <h2>${t('order_summary')}</h2>
        <div class="summary-row"><span>${t('subtotal')}</span><span>${formatPrice(subtotal)}</span></div>
        <div class="summary-row"><span>${t('shipping')}</span><span>${shipping === 0 ? t('free_shipping') : formatPrice(shipping)}</span></div>
        ${gap > 0 ? `<div class="summary-row" style="font-size:.85rem;color:var(--accent)">${t('shipping_hint').replace('{n}', convertPrice(gap).toFixed(2))}</div>` : ''}
        <div class="summary-row total"><span>${t('total')}</span><span>${formatPrice(total)}</span></div>
        <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:20px">${t('go_checkout')}</a>
        <a href="products.html" class="btn btn-outline btn-block" style="margin-top:10px;border-color:var(--primary);color:var(--primary)">${t('continue_shopping')}</a>
      </div>`;
  }

  function updateQty(id, delta) {
    const cart = getCart();
    const item = cart.find(i => i.id === id);
    if (item) {
      item.qty += delta;
      if (item.qty < 1) item.qty = 1;
      const p = products.find(pr => pr.id === id);
      if (p && item.qty > p.stock) item.qty = p.stock;
      saveCart(cart);
      renderCart();
      updateCartCount();
    }
  }

  function setQty(id, val) {
    const cart = getCart();
    const item = cart.find(i => i.id === id);
    if (item) {
      let q = parseInt(val);
      if (isNaN(q) || q < 1) q = 1;
      const p = products.find(pr => pr.id === id);
      if (p && q > p.stock) q = p.stock;
      item.qty = q;
      saveCart(cart);
      renderCart();
      updateCartCount();
    }
  }

  function removeFromCart(id) {
    let cart = getCart().filter(i => i.id !== id);
    saveCart(cart);
    renderCart();
    updateCartCount();
    showToast(t('cart_removed'));
  }

  renderCart();
  updateCartCount();
  updateUserLink();
</script>
</body>
</html>
