<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>结算 - 乐居生活</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <div class="logo"><a href="store.html">乐居<span>生活</span></a></div>
    <div class="header-actions">
      <div id="langSwitcher"></div>
      <a href="login.html" id="userLink">&#x1F464;</a>
      <a href="cart.html">&#x1F6D2; <span id="cartLabel"></span> <span class="cart-count" id="cartCount">0</span></a>
    </div>
  </div>
</header>

<div class="container">
  <div class="checkout-page" id="checkoutPage">
    <div>
      <div class="form-section">
        <h2 id="addressTitle"></h2>
        <div class="form-row">
          <div class="form-group">
            <label id="labelName"></label>
            <input type="text" id="name" required>
          </div>
          <div class="form-group">
            <label id="labelPhone"></label>
            <input type="tel" id="phone" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label id="labelRegion"></label>
            <select id="region"></select>
          </div>
          <div class="form-group">
            <label id="labelZip"></label>
            <input type="text" id="zipcode">
          </div>
        </div>
        <div class="form-group">
          <label id="labelAddress"></label>
          <textarea id="address" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label id="labelNote"></label>
          <textarea id="note" rows="2"></textarea>
        </div>
      </div>

      <div class="form-section">
        <h2 id="paymentTitle"></h2>
        <div class="payment-methods">
          <label class="payment-option selected" onclick="selectPayment(this)">
            <input type="radio" name="payment" value="wechat" checked>
            <span style="font-size:1.3rem">&#x1F4F1;</span>
            <div><strong id="payWechat"></strong><br><small style="color:var(--text-light)" id="payWechatDesc"></small></div>
          </label>
          <label class="payment-option" onclick="selectPayment(this)">
            <input type="radio" name="payment" value="alipay">
            <span style="font-size:1.3rem">&#x1F4B3;</span>
            <div><strong id="payAlipay"></strong><br><small style="color:var(--text-light)" id="payAlipayDesc"></small></div>
          </label>
          <label class="payment-option" onclick="selectPayment(this)">
            <input type="radio" name="payment" value="cod">
            <span style="font-size:1.3rem">&#x1F4E6;</span>
            <div><strong id="payCod"></strong><br><small style="color:var(--text-light)" id="payCodDesc"></small></div>
          </label>
        </div>
      </div>
    </div>
    <div>
      <div class="cart-summary" id="orderSummary"></div>
    </div>
  </div>
</div>

<footer class="site-footer" style="margin-top:60px">
  <div class="container">
    <div class="footer-bottom" id="footerCopyright"></div>
  </div>
</footer>

<div class="toast" id="toast"></div>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  applyPageI18n();

  // 应用文本
  setText('addressTitle', t('checkout_address'));
  setText('labelName', t('checkout_name'));
  document.getElementById('name').placeholder = t('checkout_name_ph');
  setText('labelPhone', t('checkout_phone'));
  document.getElementById('phone').placeholder = t('checkout_phone_ph');
  setText('labelRegion', t('checkout_region'));
  setText('labelZip', t('checkout_zip'));
  document.getElementById('zipcode').placeholder = t('checkout_zip_ph');
  setText('labelAddress', t('checkout_address_detail'));
  document.getElementById('address').placeholder = t('checkout_address_ph');
  setText('labelNote', t('checkout_note'));
  document.getElementById('note').placeholder = t('checkout_note_ph');
  setText('paymentTitle', t('checkout_payment'));
  setText('payWechat', t('pay_wechat'));
  setText('payWechatDesc', t('pay_wechat_desc'));
  setText('payAlipay', t('pay_alipay'));
  setText('payAlipayDesc', t('pay_alipay_desc'));
  setText('payCod', t('pay_cod'));
  setText('payCodDesc', t('pay_cod_desc'));

  // 城市选项
  const regionSel = document.getElementById('region');
  regionSel.innerHTML = `<option value="">${t('checkout_region_ph')}</option>` + t('cities').map(c => `<option>${c}</option>`).join('');

  function selectPayment(el) {
    document.querySelectorAll('.payment-option').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input').checked = true;
  }

  function renderOrderSummary() {
    const cart = getCart();
    if (cart.length === 0) { location.href = 'cart.html'; return; }

    let subtotal = 0;
    let itemsHtml = '';
    cart.forEach(item => {
      const p = products.find(pr => pr.id === item.id);
      if (!p) return;
      const lineTotal = p.price * item.qty;
      subtotal += lineTotal;
      itemsHtml += `<div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:.9rem"><span>${getProductName(p)} x${item.qty}</span><span>${formatPrice(lineTotal)}</span></div>`;
    });

    const shipping = subtotal >= 99 ? 0 : 10;
    const total = subtotal + shipping;

    document.getElementById('orderSummary').innerHTML = `
      <h2>${t('order_summary')}</h2>
      ${itemsHtml}
      <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:12px">
        <div class="summary-row"><span>${t('subtotal')}</span><span>${formatPrice(subtotal)}</span></div>
        <div class="summary-row"><span>${t('shipping')}</span><span>${shipping === 0 ? t('free_shipping') : formatPrice(shipping)}</span></div>
        <div class="summary-row total"><span>${t('total_due')}</span><span>${formatPrice(total)}</span></div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:20px" onclick="submitOrder()">${t('submit_order')}</button>
      <a href="cart.html" style="display:block;text-align:center;margin-top:12px;font-size:.9rem;color:var(--primary)">${t('back_to_cart')}</a>`;
  }

  function submitOrder() {
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const region = document.getElementById('region').value;
    const address = document.getElementById('address').value.trim();

    if (!name) { showToast(t('err_name')); return; }
    if (!phone || phone.length < 8) { showToast(t('err_phone')); return; }
    if (!region) { showToast(t('err_region')); return; }
    if (!address) { showToast(t('err_address')); return; }

    const user = getUser();
    if (!user) { showToast(t('err_login_first')); setTimeout(() => location.href = 'login.html', 1500); return; }

    const order = {
      id: 'ORD' + Date.now(),
      items: getCart(),
      address: { name, phone, region, address, note: document.getElementById('note').value },
      payment: document.querySelector('input[name="payment"]:checked').value,
      time: new Date().toLocaleString(),
      status: t('order_status_pending')
    };
    const orders = JSON.parse(localStorage.getItem('leju_orders') || '[]');
    orders.push(order);
    localStorage.setItem('leju_orders', JSON.stringify(orders));
    saveCart([]);
    updateCartCount();

    document.getElementById('checkoutPage').innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:80px 20px">
        <div style="font-size:4rem;margin-bottom:16px">&#x2705;</div>
        <h2 style="margin-bottom:12px">${t('order_success')}</h2>
        <p style="color:var(--text-light);margin-bottom:8px">${t('order_number')}：${order.id}</p>
        <p style="color:var(--text-light);margin-bottom:32px">${t('order_ship_soon')}</p>
        <a href="store.html" class="btn btn-primary">${t('back_to_home')}</a>
        <a href="products.html" class="btn btn-outline" style="margin-left:12px;border-color:var(--primary);color:var(--primary)">${t('continue_shopping')}</a>
      </div>`;
  }

  renderOrderSummary();
  updateCartCount();
  updateUserLink();
</script>
</body>
</html>
