<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录/注册 - 乐居生活</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <div class="logo"><a href="store.html">乐居<span>生活</span></a></div>
    <div class="header-actions">
      <div id="langSwitcher"></div>
      <a href="cart.html">&#x1F6D2; <span id="cartLabel"></span> <span class="cart-count" id="cartCount">0</span></a>
    </div>
  </div>
</header>

<div class="auth-page">
  <div class="auth-card" id="authCard">
    <h1 id="authWelcome"></h1>
    <p class="subtitle" id="authSubtitle"></p>

    <div class="auth-tabs">
      <button class="active" onclick="switchAuth('login')" id="tabLogin"></button>
      <button onclick="switchAuth('register')" id="tabRegister"></button>
    </div>

    <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label id="labelAccount"></label>
        <input type="text" id="loginAccount" required>
      </div>
      <div class="form-group">
        <label id="labelPassword"></label>
        <input type="password" id="loginPassword" required>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:.85rem">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="rememberMe"> <span id="labelRemember"></span>
        </label>
        <a href="#" style="color:var(--primary)" id="labelForgot"></a>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btnLogin"></button>
    </form>

    <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label id="labelNickname"></label>
        <input type="text" id="regName" required>
      </div>
      <div class="form-group">
        <label id="labelRegPhone"></label>
        <input type="tel" id="regPhone" required>
      </div>
      <div class="form-group">
        <label id="labelRegEmail"></label>
        <input type="email" id="regEmail">
      </div>
      <div class="form-group">
        <label id="labelRegPwd"></label>
        <input type="password" id="regPassword" required minlength="6">
      </div>
      <div class="form-group">
        <label id="labelConfirm"></label>
        <input type="password" id="regConfirm" required>
      </div>
      <div style="margin-bottom:20px">
        <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:.85rem;line-height:1.5">
          <input type="checkbox" id="agreeTerms" required style="margin-top:3px">
          <span id="agreeText"></span>
        </label>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btnRegister"></button>
    </form>

    <div class="auth-footer"><p id="authFooter"></p></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  applyPageI18n();

  // 设置文本
  setText('authWelcome', t('auth_welcome'));
  setText('authSubtitle', t('auth_subtitle'));
  setText('tabLogin', t('auth_login'));
  setText('tabRegister', t('auth_register'));
  setText('labelAccount', t('auth_account'));
  document.getElementById('loginAccount').placeholder = t('auth_account_ph');
  setText('labelPassword', t('auth_password'));
  document.getElementById('loginPassword').placeholder = t('auth_password_ph');
  setText('labelRemember', t('auth_remember'));
  setText('labelForgot', t('auth_forgot'));
  setText('btnLogin', t('auth_login'));
  setText('labelNickname', t('auth_nickname'));
  document.getElementById('regName').placeholder = t('auth_nickname_ph');
  setText('labelRegPhone', t('auth_phone'));
  document.getElementById('regPhone').placeholder = t('auth_phone_ph');
  setText('labelRegEmail', t('auth_email'));
  document.getElementById('regEmail').placeholder = t('auth_email_ph');
  setText('labelRegPwd', t('auth_password'));
  document.getElementById('regPassword').placeholder = t('auth_password_min');
  setText('labelConfirm', t('auth_confirm'));
  document.getElementById('regConfirm').placeholder = t('auth_confirm_ph');
  document.getElementById('agreeText').innerHTML = `${t('auth_agree')} <a href="#" style="color:var(--primary)">${t('auth_terms')}</a> ${getCurrentLang() === 'zh' ? '和' : '&'} <a href="index.html" style="color:var(--primary)">${t('auth_privacy')}</a>`;
  setText('btnRegister', t('auth_register'));
  setText('authFooter', t('auth_footer'));

  function switchAuth(type) {
    document.querySelectorAll('.auth-tabs button').forEach((b, i) => {
      b.classList.toggle('active', (type === 'login' && i === 0) || (type === 'register' && i === 1));
    });
    document.getElementById('loginForm').classList.toggle('active', type === 'login');
    document.getElementById('registerForm').classList.toggle('active', type === 'register');
  }

  function handleLogin(e) {
    e.preventDefault();
    const account = document.getElementById('loginAccount').value.trim();
    const password = document.getElementById('loginPassword').value;
    const users = JSON.parse(localStorage.getItem('leju_users') || '[]');
    const user = users.find(u => (u.phone === account || u.email === account) && u.password === password);

    if (user) {
      localStorage.setItem('leju_user', JSON.stringify({ name: user.name, phone: user.phone, email: user.email }));
      showToast(t('auth_login_success'));
    } else {
      localStorage.setItem('leju_user', JSON.stringify({ name: account.split('@')[0], phone: account, email: '' }));
      showToast(t('auth_login_ok'));
    }
    setTimeout(() => location.href = 'store.html', 1000);
  }

  function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;

    if (!name) { showToast(t('err_nickname')); return; }
    if (phone.length < 8) { showToast(t('err_phone_invalid')); return; }
    if (password.length < 6) { showToast(t('err_pwd_short')); return; }
    if (password !== confirm) { showToast(t('err_pwd_mismatch')); return; }
    if (!document.getElementById('agreeTerms').checked) { showToast(t('err_agree')); return; }

    const users = JSON.parse(localStorage.getItem('leju_users') || '[]');
    if (users.some(u => u.phone === phone)) { showToast(t('err_phone_exists')); return; }
    users.push({ name, phone, email, password });
    localStorage.setItem('leju_users', JSON.stringify(users));
    localStorage.setItem('leju_user', JSON.stringify({ name, phone, email }));

    showToast(t('auth_register_success'));
    setTimeout(() => location.href = 'store.html', 1000);
  }

  // 已登录则显示个人中心
  const user = getUser();
  if (user) {
    document.getElementById('authCard').innerHTML = `
      <h1>${t('auth_center')}</h1>
      <p class="subtitle">${t('auth_welcome_back')}，${user.name}</p>
      <div style="text-align:center;padding:32px 0">
        <div style="font-size:4rem;margin-bottom:16px">&#x1F464;</div>
        <h3 style="margin-bottom:8px">${user.name}</h3>
        <p style="color:var(--text-light);margin-bottom:32px">${user.phone}</p>
        <div style="display:flex;flex-direction:column;gap:12px;max-width:280px;margin:0 auto">
          <a href="#" class="btn btn-outline" style="border-color:var(--primary);color:var(--primary)" onclick="viewOrders()">${t('auth_my_orders')}</a>
          <button class="btn btn-outline" style="border-color:#e63946;color:#e63946" onclick="logout()">${t('auth_logout')}</button>
        </div>
      </div>`;
  }

  function viewOrders() {
    const orders = JSON.parse(localStorage.getItem('leju_orders') || '[]');
    if (orders.length === 0) { showToast(t('auth_no_orders')); return; }
    let html = `<h1>${t('auth_my_orders')}</h1><div style="margin-top:24px">`;
    orders.reverse().forEach(o => {
      html += `<div style="background:var(--bg);padding:16px;border-radius:var(--radius);margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><strong>${o.id}</strong><span style="color:var(--primary)">${o.status}</span></div>
        <div style="font-size:.85rem;color:var(--text-light)">${o.time} | ${o.items.length} ${t('auth_items')}</div>
      </div>`;
    });
    html += `</div><button class="btn btn-outline btn-block" style="margin-top:20px;border-color:var(--primary);color:var(--primary)" onclick="location.reload()">${t('auth_back')}</button>`;
    document.getElementById('authCard').innerHTML = html;
  }

  function logout() {
    localStorage.removeItem('leju_user');
    showToast(t('auth_logged_out'));
    setTimeout(() => location.reload(), 800);
  }

  updateCartCount();
</script>
</body>
</html>
