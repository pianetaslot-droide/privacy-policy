<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录/注册 - 乐居生活</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <div class="logo"><a href="store.html">乐居<span>生活</span></a></div>
    <div class="header-actions">
      <a href="cart.html">&#x1F6D2; 购物车 <span class="cart-count" id="cartCount">0</span></a>
    </div>
  </div>
</header>

<div class="auth-page">
  <div class="auth-card">
    <h1>欢迎来到乐居生活</h1>
    <p class="subtitle">登录账户，享受便捷购物体验</p>

    <div class="auth-tabs">
      <button class="active" onclick="switchAuth('login')">登录</button>
      <button onclick="switchAuth('register')">注册</button>
    </div>

    <!-- 登录表单 -->
    <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>手机号 / 邮箱</label>
        <input type="text" id="loginAccount" placeholder="请输入手机号或邮箱" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="请输入密码" required>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:.85rem">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="rememberMe"> 记住我
        </label>
        <a href="#" style="color:var(--primary)">忘记密码？</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>

    <!-- 注册表单 -->
    <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>昵称</label>
        <input type="text" id="regName" placeholder="给自己起个名字吧" required>
      </div>
      <div class="form-group">
        <label>手机号</label>
        <input type="tel" id="regPhone" placeholder="请输入手机号" required>
      </div>
      <div class="form-group">
        <label>邮箱（选填）</label>
        <input type="email" id="regEmail" placeholder="请输入邮箱地址">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="regPassword" placeholder="至少6位密码" required minlength="6">
      </div>
      <div class="form-group">
        <label>确认密码</label>
        <input type="password" id="regConfirm" placeholder="请再次输入密码" required>
      </div>
      <div style="margin-bottom:20px">
        <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:.85rem;line-height:1.5">
          <input type="checkbox" id="agreeTerms" required style="margin-top:3px">
          我已阅读并同意 <a href="#" style="color:var(--primary)">用户协议</a> 和 <a href="index.html" style="color:var(--primary)">隐私政策</a>
        </label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">注册</button>
    </form>

    <div class="auth-footer">
      <p>注册即表示您同意我们的服务条款</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
<script>
  function switchAuth(type) {
    document.querySelectorAll('.auth-tabs button').forEach((b, i) => {
      b.classList.toggle('active', (type === 'login' && i === 0) || (type === 'register' && i === 1));
    });
    document.getElementById('loginForm').classList.toggle('active', type === 'login');
    document.getElementById('registerForm').classList.toggle('active', type === 'register');
  }

  function handleLogin(e) {
    e.preventDefault();
    const account = document.getElementById('loginAccount').value.trim();
    const password = document.getElementById('loginPassword').value;

    // 模拟登录：在本地存储中查找用户
    const users = JSON.parse(localStorage.getItem('leju_users') || '[]');
    const user = users.find(u => (u.phone === account || u.email === account) && u.password === password);

    if (user) {
      localStorage.setItem('leju_user', JSON.stringify({ name: user.name, phone: user.phone, email: user.email }));
      showToast('登录成功，欢迎回来！');
      setTimeout(() => location.href = 'store.html', 1000);
    } else {
      // 演示模式：任意账号密码可登录
      localStorage.setItem('leju_user', JSON.stringify({ name: account.split('@')[0], phone: account, email: '' }));
      showToast('登录成功！');
      setTimeout(() => location.href = 'store.html', 1000);
    }
  }

  function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;

    if (!name) { showToast('请输入昵称'); return; }
    if (!/^1\d{10}$/.test(phone)) { showToast('请输入正确的手机号码'); return; }
    if (password.length < 6) { showToast('密码至少6位'); return; }
    if (password !== confirm) { showToast('两次密码不一致'); return; }
    if (!document.getElementById('agreeTerms').checked) { showToast('请同意用户协议'); return; }

    // 保存用户
    const users = JSON.parse(localStorage.getItem('leju_users') || '[]');
    if (users.some(u => u.phone === phone)) { showToast('该手机号已注册'); return; }
    users.push({ name, phone, email, password });
    localStorage.setItem('leju_users', JSON.stringify(users));
    localStorage.setItem('leju_user', JSON.stringify({ name, phone, email }));

    showToast('注册成功，已自动登录！');
    setTimeout(() => location.href = 'store.html', 1000);
  }

  // 如果已登录，显示用户信息
  const user = getUser();
  if (user) {
    document.querySelector('.auth-card').innerHTML = `
      <h1>个人中心</h1>
      <p class="subtitle">欢迎，${user.name}</p>
      <div style="text-align:center;padding:32px 0">
        <div style="font-size:4rem;margin-bottom:16px">&#x1F464;</div>
        <h3 style="margin-bottom:8px">${user.name}</h3>
        <p style="color:var(--text-light);margin-bottom:32px">${user.phone}</p>
        <div style="display:flex;flex-direction:column;gap:12px;max-width:280px;margin:0 auto">
          <a href="#" class="btn btn-outline" style="border-color:var(--primary);color:var(--primary)" onclick="viewOrders()">我的订单</a>
          <button class="btn btn-outline" style="border-color:#e63946;color:#e63946" onclick="logout()">退出登录</button>
        </div>
      </div>`;
  }

  function viewOrders() {
    const orders = JSON.parse(localStorage.getItem('leju_orders') || '[]');
    if (orders.length === 0) {
      showToast('暂无订单记录');
      return;
    }
    let html = '<h1>我的订单</h1><div style="margin-top:24px">';
    orders.reverse().forEach(o => {
      html += `<div style="background:var(--bg);padding:16px;border-radius:var(--radius);margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
          <strong>${o.id}</strong><span style="color:var(--primary)">${o.status}</span>
        </div>
        <div style="font-size:.85rem;color:var(--text-light)">${o.time} | ${o.items.length}件商品</div>
      </div>`;
    });
    html += '</div><button class="btn btn-outline btn-block" style="margin-top:20px;border-color:var(--primary);color:var(--primary)" onclick="location.reload()">返回</button>';
    document.querySelector('.auth-card').innerHTML = html;
  }

  function logout() {
    localStorage.removeItem('leju_user');
    showToast('已退出登录');
    setTimeout(() => location.reload(), 800);
  }

  updateCartCount();
</script>
</body>
</html>
