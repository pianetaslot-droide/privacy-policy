<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部商品 - 乐居生活</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .products-page { display: grid; grid-template-columns: 220px 1fr; gap: 48px; padding: 48px 0; }
    .filter-sidebar { padding: 0; height: fit-content; position: sticky; top: 140px; }
    .filter-sidebar h3 { font-size: .9rem; margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; font-weight: 400; padding-bottom: 16px; border-bottom: 1px solid var(--border-light); }
    .filter-group { margin-bottom: 28px; }
    .filter-group h4 { font-size: .82rem; margin-bottom: 14px; color: var(--text-light); letter-spacing: 1px; font-weight: 400; }
    .filter-group label { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; font-size: .85rem; color: var(--text-light); transition: color .2s; }
    .filter-group label:hover { color: var(--text); }
    .filter-group input { accent-color: var(--primary); }
    .sort-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border-light); }
    .sort-bar select { padding: 10px 16px; border: 1px solid var(--border); font-size: .85rem; letter-spacing: .5px; background: transparent; }
    .result-count { color: var(--text-muted); font-size: .85rem; letter-spacing: .5px; }
    @media (max-width: 768px) { .products-page { grid-template-columns: 1fr; } .filter-sidebar { display: none; } }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <div class="logo"><a href="store.html">乐居<span>生活</span></a></div>
    <div class="header-search">
      <input type="text" id="searchInput">
      <button onclick="handleSearch()" id="searchBtn"></button>
    </div>
    <div class="header-actions">
      <div id="langSwitcher"></div>
      <a href="login.html" id="userLink">&#x1F464;</a>
      <a href="cart.html">&#x1F6D2; <span id="cartLabel"></span> <span class="cart-count" id="cartCount">0</span></a>
    </div>
  </div>
  <nav class="main-nav"><div class="container"><ul id="mainNav"></ul></div></nav>
</header>

<div class="container">
  <div class="products-page">
    <aside class="filter-sidebar" id="filterSidebar"></aside>
    <main>
      <div class="sort-bar">
        <span class="result-count" id="resultCount"></span>
        <select id="sortSelect" onchange="filterProducts()"></select>
      </div>
      <div class="products-grid" id="productList"></div>
    </main>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" id="footerCopyright"></div>
  </div>
</footer>

<div class="toast" id="toast"></div>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  applyPageI18n();

  // 构建筛选栏
  const cats = [
    { value: '', key: 'filter_all' },
    { value: 'kitchen', key: 'nav_kitchen' },
    { value: 'bedroom', key: 'nav_bedroom' },
    { value: 'bathroom', key: 'nav_bathroom' },
    { value: 'decor', key: 'nav_decor' },
    { value: 'storage', key: 'nav_storage' },
    { value: 'lighting', key: 'cat_lighting' },
  ];
  const prices = [
    { value: '', key: 'filter_all' },
    { value: '0-50', key: 'price_under_50' },
    { value: '50-100', key: 'price_50_100' },
    { value: '100-200', key: 'price_100_200' },
    { value: '200-999', key: 'price_over_200' },
  ];

  document.getElementById('filterSidebar').innerHTML = `
    <h3>${t('filter_title')}</h3>
    <div class="filter-group">
      <h4>${t('filter_category')}</h4>
      ${cats.map(c => `<label><input type="radio" name="cat" value="${c.value}" ${c.value === '' ? 'checked' : ''} onchange="filterProducts()"> ${t(c.key)}</label>`).join('')}
    </div>
    <div class="filter-group">
      <h4>${t('filter_price')}</h4>
      ${prices.map(p => `<label><input type="radio" name="price" value="${p.value}" ${p.value === '' ? 'checked' : ''} onchange="filterProducts()"> ${t(p.key)}</label>`).join('')}
    </div>`;

  document.getElementById('sortSelect').innerHTML = `
    <option value="default">${t('sort_default')}</option>
    <option value="price-asc">${t('sort_price_asc')}</option>
    <option value="price-desc">${t('sort_price_desc')}</option>
    <option value="name">${t('sort_name')}</option>`;

  // 读取 URL 参数预选分类
  const params = new URLSearchParams(location.search);
  const catParam = params.get('cat');
  if (catParam) {
    const radio = document.querySelector(`input[name="cat"][value="${catParam}"]`);
    if (radio) radio.checked = true;
  }

  function filterProducts() {
    const cat = document.querySelector('input[name="cat"]:checked').value;
    const priceRange = document.querySelector('input[name="price"]:checked').value;
    const sort = document.getElementById('sortSelect').value;

    let filtered = [...products];
    if (cat) filtered = filtered.filter(p => p.category === cat);
    if (priceRange) {
      const [min, max] = priceRange.split('-').map(Number);
      filtered = filtered.filter(p => p.price >= min && p.price <= max);
    }

    if (sort === 'price-asc') filtered.sort((a, b) => a.price - b.price);
    else if (sort === 'price-desc') filtered.sort((a, b) => b.price - a.price);
    else if (sort === 'name') filtered.sort((a, b) => getProductName(a).localeCompare(getProductName(b)));

    document.getElementById('resultCount').textContent = t('result_count').replace('{n}', filtered.length);
    renderProducts('productList', filtered);
  }

  filterProducts();
  updateCartCount();
  updateUserLink();
</script>
</body>
</html>
