<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乐居生活 - LeJu Living</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <div class="logo">乐居<span>生活</span></div>
    <div class="header-search">
      <input type="text" id="searchInput">
      <button onclick="handleSearch()" id="searchBtn"></button>
    </div>
    <div class="header-actions">
      <div id="langSwitcher"></div>
      <a href="login.html" id="userLink">&#x1F464;</a>
      <a href="cart.html">&#x1F6D2; <span id="cartLabel"></span> <span class="cart-count" id="cartCount">0</span></a>
    </div>
  </div>
  <nav class="main-nav">
    <div class="container">
      <ul id="mainNav"></ul>
    </div>
  </nav>
</header>

<section class="hero">
  <div class="container">
    <h1 id="heroTitle"></h1>
    <p id="heroSubtitle"></p>
    <a href="products.html" class="btn btn-primary" style="margin-right:12px" id="heroShopBtn"></a>
    <a href="products.html?sale=1" class="btn btn-outline" id="heroSaleBtn"></a>
  </div>
</section>

<section class="section">
  <div class="container">
    <h2 class="section-title" id="catTitle"></h2>
    <p class="section-subtitle" id="catSubtitle"></p>
    <div class="categories-grid">
      <a href="products.html?cat=kitchen" class="category-card">
        <div class="category-icon">&#x1F373;</div>
        <h3 class="cat-name" data-key="cat_kitchen"></h3>
      </a>
      <a href="products.html?cat=bedroom" class="category-card">
        <div class="category-icon">&#x1F6CF;&#xFE0F;</div>
        <h3 class="cat-name" data-key="cat_bedroom"></h3>
      </a>
      <a href="products.html?cat=bathroom" class="category-card">
        <div class="category-icon">&#x1F6C1;</div>
        <h3 class="cat-name" data-key="cat_bathroom"></h3>
      </a>
      <a href="products.html?cat=decor" class="category-card">
        <div class="category-icon">&#x1F3A8;</div>
        <h3 class="cat-name" data-key="cat_decor"></h3>
      </a>
      <a href="products.html?cat=storage" class="category-card">
        <div class="category-icon">&#x1F4E6;</div>
        <h3 class="cat-name" data-key="cat_storage"></h3>
      </a>
      <a href="products.html?cat=lighting" class="category-card">
        <div class="category-icon">&#x1F4A1;</div>
        <h3 class="cat-name" data-key="cat_lighting"></h3>
      </a>
    </div>
  </div>
</section>

<section class="section" style="background:#fff">
  <div class="container">
    <h2 class="section-title" id="featuredTitle"></h2>
    <p class="section-subtitle" id="featuredSubtitle"></p>
    <div class="products-grid" id="featuredProducts"></div>
  </div>
</section>

<section class="section">
  <div class="container">
    <h2 class="section-title" id="newTitle"></h2>
    <p class="section-subtitle" id="newSubtitle"></p>
    <div class="products-grid" id="newProducts"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-about">
        <div class="logo">乐居<span>生活</span></div>
        <p id="footerAbout"></p>
      </div>
      <div class="footer-col">
        <h3 id="footerGuideTitle"></h3>
        <ul>
          <li><a href="#" id="footerGuide1"></a></li>
          <li><a href="#" id="footerGuide2"></a></li>
          <li><a href="#" id="footerGuide3"></a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h3 id="footerServiceTitle"></h3>
        <ul>
          <li><a href="#" id="footerService1"></a></li>
          <li><a href="#" id="footerService2"></a></li>
          <li><a href="#" id="footerService3"></a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h3 id="footerContactTitle"></h3>
        <ul>
          <li id="footerContact1"></li>
          <li id="footerContact2"></li>
          <li id="footerContact3"></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom" id="footerCopyright"></div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  applyPageI18n();
  // 首页特有文本
  setText('heroTitle', t('hero_title'));
  setText('heroSubtitle', t('hero_subtitle'));
  setText('heroShopBtn', t('hero_shop_now'));
  setText('heroSaleBtn', t('hero_sale'));
  setText('catTitle', t('cat_title'));
  setText('catSubtitle', t('cat_subtitle'));
  setText('featuredTitle', t('featured_title'));
  setText('featuredSubtitle', t('featured_subtitle'));
  setText('newTitle', t('new_title'));
  setText('newSubtitle', t('new_subtitle'));
  // 分类名称
  document.querySelectorAll('.cat-name').forEach(el => {
    el.textContent = t(el.dataset.key);
  });

  renderProducts('featuredProducts', products.filter(p => p.featured));
  renderProducts('newProducts', products.filter(p => p.isNew));
  updateCartCount();
  updateUserLink();
</script>
</body>
</html>
